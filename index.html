// Bild lesen, verkleinern (max 1600px), als JPEG-Base64 liefern
function fotoZuBase64(file,cb){
  var rd=new FileReader();
  rd.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var MAX=1600,w=img.width,h=img.height;
      if(w>MAX||h>MAX){var s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      var c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      var dataUrl=c.toDataURL("image/jpeg",0.85);
      cb(null,dataUrl.split(",")[1],"image/jpeg");
    };
    img.onerror=function(){cb("Bild konnte nicht gelesen werden.");};
    img.src=e.target.result;
  };
  rd.onerror=function(){cb("Datei konnte nicht gelesen werden.");};
  rd.readAsDataURL(file);
}

function getKurSeason(d){var m=d.getMonth()+1,dy=d.getDate();if(m>=5&&m<=10)return"hs";if(m===12&&dy>=20)return"hs";if(m===1&&dy<=6)return"hs";return"ns";}
// b: {von,bis,hunde,pers,kurErw,kurKind,kurBeh}. kurErw default = pers falls nicht gesetzt.
function calcKurtaxe(b){
  if(!KURTAXE.active)return{total:0,hsN:0,nsN:0,days:0};
  var dV=pd(b.von),dB=pd(b.bis);
  var erw=(b.kurErw!=null?b.kurErw:(b.pers||0));
  var kind=b.kurKind||0,beh=b.kurBeh||0,hunde=b.hunde||0;
  var d=new Date(dV),total=0,hsN=0,nsN=0,days=0;
  while(d<=dB){ // Kurtaxe wird in TAGEN berechnet: An- und Abreisetag zaehlen jeweils mit
    var s=getKurSeason(d),r=KURTAXE[s];
    total+=erw*r.erw+kind*r.kind+beh*r.beh+hunde*KURTAXE.hund;
    if(s==="hs")hsN++;else nsN++;
    days++;
    d.setDate(d.getDate()+1);
  }
  return{total:Math.round(total*100)/100,hsN:hsN,nsN:nsN,days:days};
}

function pd(s){return new Date(s+"T00:00:00")}

function getStoredCost(uid,b){
  var u=UNITS.find(function(x){return x.id===uid;});
  if(!b.total){
    var c=calcBookingCost(uid,b);
    c.rest=Math.floor((c.total/2)/10)*10;
    c.anz=Math.round((c.total-c.rest)*100)/100;
    c.live=true;
    return c;
  }
  var nights=Math.round((pd(b.bis)-pd(b.von))/864e5);
  return{
    total:b.total||0,nights:nights,accom:b.accom||0,seasonBreakdown:b.seasonBreakdown||null,
    extraPersCount:Math.max(0,(b.pers||0)-2),extraRate:(b.extraRate!=null?b.extraRate:(u?u.extra:0))||0,
    extraFee:b.extraFee||0,dogFee:b.dogFee||0,waescheFee:b.waescheFee||0,cleaning:b.cleanFee||0,
    kurFee:b.kurFee||0,kurDays:(b.kurDays!=null?b.kurDays:nights+1),kurHsN:b.kurHsN||0,kurNsN:b.kurNsN||0,
    subtotal:Math.round(((b.accom||0)+(b.extraFee||0)+(b.dogFee||0)+(b.waescheFee||0)+(b.cleanFee||0))*100)/100,
    anz:(b.anzahlung?b.anzahlung.amount:0),rest:(b.restzahlung?b.restzahlung.amount:0)
  };
}

function calcBookingCost(uid,b){
  var u=UNITS.find(function(x){return x.id===uid;});
  if(!u||!b.von||!b.bis||b.bis<=b.von){
    return{accom:0,seasonBreakdown:[],nights:0,extraPersCount:0,extraRate:(u?u.extra:0),extraFee:0,dogFee:0,waescheFee:0,cleaning:(u?u.clean:0),subtotal:0,total:0,laundry:(u?u.laundry:0),kurFee:0,kurDays:0,kurHsN:0,kurNsN:0};
  }
  var n=Math.round((pd(b.bis)-pd(b.von))/864e5);
  var dV=pd(b.von),dB=pd(b.bis),d=new Date(dV),seasonNights={off:0,neb:0,hau:0};
  var accom=0,groups={},order={off:0,neb:1,hau:2};
  // Manueller Preis/Nacht fuer diese Buchung (ueberschreibt Saison-/Tagespreise)
  var flatN=(b.nachtPreis!=null&&b.nachtPreis!==""&&parseFloat(b.nachtPreis)>0)?parseFloat(b.nachtPreis):null;
  while(d<dB){
    var s=getSeason(d),rate=(flatN!=null)?flatN:getPrice(uid,d);
    seasonNights[s]++;accom+=rate;
    var gk=s+"|"+rate;
    if(!groups[gk])groups[gk]={season:s,rate:rate,nights:0,subtotal:0};
    groups[gk].nights++;groups[gk].subtotal+=rate;
    d.setDate(d.getDate()+1);
  }
  accom=Math.round(accom*100)/100;
  var seasonBreakdown=Object.keys(groups).map(function(k){return groups[k];});
  seasonBreakdown.sort(function(a,b){return (order[a.season]-order[b.season])||(b.rate-a.rate);});
  var extraPersCount=Math.max(0,(b.pers||0)-2);
  var extraRate=u.extra||0;
  var extraFee=extraPersCount*extraRate*n;
  var dogFee=(b.hunde||0)*u.dog*n;
  // Waeschepakete: Anzahl (Standard = Personen) x Preis/Paket (Standard = u.laundry)
  var wPakete = (b.waeschePakete!=null) ? b.waeschePakete : (b.waesche ? (b.pers||0) : 0);
  var wPreis  = (b.waeschePreis!=null && b.waeschePreis!=="") ? b.waeschePreis : u.laundry;
  var waescheFee=Math.round(wPakete*wPreis*100)/100;
  var kur=calcKurtaxe(b);
  var subtotal=Math.round((accom+extraFee+dogFee+waescheFee+u.clean)*100)/100;
  var total=Math.round((subtotal+kur.total)*100)/100;
  return{accom:accom,seasonBreakdown:seasonBreakdown,nights:n,extraPersCount:extraPersCount,extraRate:extraRate,extraFee:extraFee,dogFee:dogFee,waescheFee:waescheFee,waeschePakete:wPakete,waeschePreis:wPreis,cleaning:u.clean,subtotal:subtotal,total:total,laundry:u.laundry,kurFee:kur.total,kurDays:kur.days,kurHsN:kur.hsN,kurNsN:kur.nsN};
}

function genInvNr(uid,von){return uid.toUpperCase().replace("dv","DV").replace("sv","SV")+"-"+von.replace(/-/g,"");}
function eur(x){return (Math.round((x||0)*100)/100).toFixed(2);}

function buildPositionsText(uid,b,cost){
  var u=UNITS.find(function(x){return x.id===uid;});
  var t="";
  t+="Unterkunft (2 Pers. inkl.):\n";
  if(cost.seasonBreakdown&&cost.seasonBreakdown.length){
    cost.seasonBreakdown.forEach(function(sb){
      var snm=sb.season==="hau"?"Hauptsaison":(sb.season==="neb"?"Nebensaison":"Nebenzeit");
      t+="  "+sb.nights+" Naechte "+snm+" x "+eur(sb.rate)+" EUR  =  "+eur(sb.subtotal)+" EUR\n";
    });
  }else{
    t+="  "+cost.nights+" Naechte  =  "+eur(cost.accom)+" EUR\n";
  }
  if(cost.extraPersCount>0)t+="Zusatzpersonen: "+cost.extraPersCount+" Pers. x "+eur(cost.extraRate)+" EUR x "+cost.nights+" Naechte  =  "+eur(cost.extraFee)+" EUR\n";
  if(b.hunde)t+="Hunde: "+b.hunde+" x "+eur(u.dog)+" EUR x "+cost.nights+" Naechte  =  "+eur(cost.dogFee)+" EUR\n";
  if(cost.waescheFee)t+="Waeschepaket: "+cost.waeschePakete+" x "+eur(cost.waeschePreis)+" EUR  =  "+eur(cost.waescheFee)+" EUR\n";
  else t+="Waeschepaket: ohne\n";
  t+="Endreinigung:  "+eur(cost.cleaning)+" EUR\n";
  t+="Zwischensumme:  "+eur(cost.subtotal)+" EUR\n\n";
  var kErw=(b.kurErw!=null?b.kurErw:(b.pers||0)),kKind=b.kurKind||0,kBeh=b.kurBeh||0;
  t+="Kurabgabe (Kurtaxe), "+cost.kurDays+" Tage (inkl. An- und Abreisetag):\n";
  t+="  "+kErw+" Erwachsene";
  if(kKind)t+="  /  "+kKind+" Kind(er) 7-14 Jahre";

  t+="\n  Kurabgabe gesamt:  "+eur(cost.kurFee)+" EUR\n\n";
  t+="ENDBETRAG:  "+eur(cost.total)+" EUR\n";
  return t;
}

/* Manueller Tagespreis: Klick auf freien Tag -> Preis eingeben (leer = zurueck zum Saisonpreis) */
function onTagPreis(uid,datum){
  if(!DATA[uid].manualPrices)DATA[uid].manualPrices={};
  var saison=DATA[uid].prices[getSeason(pd(datum))];
  var aktuell=(DATA[uid].manualPrices[datum]!=null)?DATA[uid].manualPrices[datum]:saison;
  var eingabe=prompt("Preis fuer "+fmt(datum)+" (EUR):\n(leer lassen = Saisonpreis "+saison+" EUR)",aktuell);
  if(eingabe===null)return;                       // Abbrechen -> nichts aendern
  eingabe=(""+eingabe).trim().replace(",",".");
  if(eingabe===""){ delete DATA[uid].manualPrices[datum]; }   // leer -> Saisonpreis
  else{ var v=parseFloat(eingabe); if(isNaN(v)||v<0){alert("Ungueltiger Preis.");return;} DATA[uid].manualPrices[datum]=v; }
  saveAll(true);renderCal(uid);
}

function addB(uid){

  var email=document.getElementById("be_"+uid).value.trim();

  var kurKind=parseInt(document.getElementById("bkk_"+uid).value)||0;
  var kurBeh=parseInt(document.getElementById("bkb_"+uid).value)||0;
  var waeschePakete=parseInt(document.getElementById("bw_"+uid).value)||0;
  var waesche=waeschePakete>0;

  var status=document.getElementById("bs_"+uid).value;
  if(!von||!bis||!gast){alert("Bitte Anreise, Abreise und Gastname eingeben.");return;}

  var strasse=document.getElementById("bstr_"+uid).value.trim();
  var plzort=document.getElementById("bplz_"+uid).value.trim();
  var entry={von:von,bis:bis,gast:gast,email:email,phone:phone,strasse:strasse,plzort:plzort,pers:pers,hunde:hunde,kurErw:kurErw,kurKind:kurKind,kurBeh:kurBeh,waesche:waesche,waeschePakete:waeschePakete,source:source,anfrage:status==="anfrage",_id:DATA[uid].nextId++,confirmed:false,buchDatum:dk(TODAY),anzahlung:{amount:0,date:"",paid:false},restzahlung:{amount:0,date:"",paid:false},notes:""};
  var cost=calcBookingCost(uid,entry);
  entry.total=cost.total;
  entry.accom=cost.accom;
  entry.seasonBreakdown=cost.seasonBreakdown;
  entry.extraRate=cost.extraRate;
  entry.extraFee=cost.extraFee;
  entry.dogFee=cost.dogFee;
  entry.waescheFee=cost.waescheFee;
  entry.cleanFee=cost.cleaning;
  entry.kurFee=cost.kurFee;
  entry.kurDays=cost.kurDays;
  entry.kurHsN=cost.kurHsN;
  entry.kurNsN=cost.kurNsN;
  // Restzahlung = glatter 10er-Betrag (abgerundet), Anzahlung traegt den kompletten Cent-Betrag
  var restAmt=Math.floor((cost.total/2)/10)*10;
  entry.restzahlung.amount=restAmt;
  entry.anzahlung.amount=Math.round((cost.total-restAmt)*100)/100;
  var ovs=findOv(uid,von,bis);
  if(ovs.length>0){if(!confirm("Belegt: "+ovs.map(function(b){return b.gast;}).join(", ")+"\nUeberschreiben?")){return;}var ids={};ovs.forEach(function(b){ids[b._id]=1;});DATA[uid].bookings=DATA[uid].bookings.filter(function(b){return!ids[b._id];});saveAll();}
  DATA[uid].bookings.push(entry);
  saveAll(true);
  document.getElementById("bg_"+uid).value="";document.getElementById("be_"+uid).value="";document.getElementById("bt_"+uid).value="";
  renderAll();
}

// Fuellt alle Preisfelder aus Anreise/Abreise/Personen/Hunde/Waesche - fuer importierte Anfragen
function autoFillEdit(uid,id){
  var von=document.getElementById("ed_von").value, bis=document.getElementById("ed_bis").value;
  if(!von||!bis||bis<=von){ alert("Bitte zuerst gueltige Anreise und Abreise eintragen."); return; }
  var tmp={
    von:von, bis:bis,
    pers:parseInt(document.getElementById("ed_pers").value)||2,
    hunde:parseInt(document.getElementById("ed_hunde").value)||0,
    waesche:(parseInt(document.getElementById("ed_wpakete").value)||0)>0,
    waeschePakete:parseInt(document.getElementById("ed_wpakete").value)||0,
    waeschePreis:parseFloat(document.getElementById("ed_wpreis").value),
    kurErw:parseInt(document.getElementById("ed_kurerw").value)||0,
    kurKind:parseInt(document.getElementById("ed_kurkind").value)||0,
    kurBeh:parseInt(document.getElementById("ed_kurbeh").value)||0,
    nachtPreis:(function(){var v=document.getElementById("ed_nacht").value;return (v!==""&&parseFloat(v)>0)?parseFloat(v):null;})()
  };
  var c=calcBookingCost(uid,tmp);
  document.getElementById("ed_accom").value=c.accom;
  document.getElementById("ed_extra").value=c.extraFee;
  document.getElementById("ed_dog").value=c.dogFee;
  document.getElementById("ed_waesche").value=c.waescheFee;
  if(c.waeschePreis!=null)document.getElementById("ed_wpreis").value=c.waeschePreis;
  updWaesche();
  document.getElementById("ed_clean").value=c.cleaning;
  document.getElementById("ed_kurfee").value=c.kurFee;
  document.getElementById("ed_total").value=c.total;
  var rest=Math.floor((c.total/2)/10)*10;
  document.getElementById("ed_rest").value=rest;
  document.getElementById("ed_anz").value=Math.round((c.total-rest)*100)/100;
  alert("Preise berechnet:\n"+c.nights+" Naechte, Gesamt "+eur(c.total)+" EUR\n(noch nicht gespeichert - bitte 'Speichern' druecken)");
}

function updWaesche(){
  var pk=parseInt(document.getElementById("ed_wpakete").value)||0;
  var pr=parseFloat(document.getElementById("ed_wpreis").value)||0;
  var sum=Math.round(pk*pr*100)/100;
  document.getElementById("ed_waesche").value=sum;
  var c=document.getElementById("ed_wcalc");
  if(c)c.textContent=pk+" x "+eur(pr)+" = "+eur(sum)+" EUR";
}

function calcEditTotal(){
  var a=parseFloat(document.getElementById("ed_accom").value)||0;
  var x=parseFloat(document.getElementById("ed_extra").value)||0;
  var d=parseFloat(document.getElementById("ed_dog").value)||0;
  var w=parseFloat(document.getElementById("ed_waesche").value)||0;
  var r=parseFloat(document.getElementById("ed_clean").value)||0;
  var k=parseFloat(document.getElementById("ed_kurfee").value)||0;
  var total=Math.round((a+x+d+w+r+k)*100)/100;
  if(confirm("Gesamtpreis auf "+total+" EUR setzen?\nAnzahlung/Rest werden automatisch neu aufgeteilt.")){
    document.getElementById("ed_total").value=total;
    splitTotal();
  }
}

/* Gesamtpreis -> Aufteilung: Rest = glatter 10er (abgerundet, ca. Haelfte), Anzahlung = Differenz */
function splitTotal(){
  var total=parseFloat(document.getElementById("ed_total").value)||0;
  var rest=Math.floor((total/2)/10)*10;
  var anz=Math.round((total-rest)*100)/100;
  document.getElementById("ed_rest").value=rest;
  document.getElementById("ed_anz").value=anz;
}
/* Anzahlung manuell geaendert -> Rest = Gesamt - Anzahlung */
function syncRest(){
  var total=parseFloat(document.getElementById("ed_total").value)||0;
  var anz=parseFloat(document.getElementById("ed_anz").value)||0;
  document.getElementById("ed_rest").value=Math.round((total-anz)*100)/100;
}
/* Rest manuell geaendert -> Anzahlung = Gesamt - Rest */
function syncAnz(){
  var total=parseFloat(document.getElementById("ed_total").value)||0;
  var rest=parseFloat(document.getElementById("ed_rest").value)||0;
  document.getElementById("ed_anz").value=Math.round((total-rest)*100)/100;
}
/* Faelligkeit Anzahlung = Buchungsdatum + 7 Tage */
function anzFrist(b){
  var base=b&&b.buchDatum?pd(b.buchDatum):new Date(TODAY);
  var f=new Date(base);f.setDate(f.getDate()+7);return dk(f);
}

function saveEdit(uid,id){
  var b=DATA[uid].bookings.find(function(x){return x._id===id;});if(!b)return;
  b.gast=document.getElementById("ed_gast").value.trim();
  b.email=document.getElementById("ed_email").value.trim();
  b.phone=document.getElementById("ed_phone").value.trim();
  b.strasse=document.getElementById("ed_str").value.trim();
  b.plzort=document.getElementById("ed_plz").value.trim();
  b.pers=parseInt(document.getElementById("ed_pers").value)||2;
  b.hunde=parseInt(document.getElementById("ed_hunde").value)||0;
  b.kurErw=parseInt(document.getElementById("ed_kurerw").value)||0;
  b.kurKind=parseInt(document.getElementById("ed_kurkind").value)||0;
  b.kurBeh=parseInt(document.getElementById("ed_kurbeh").value)||0;
  b.waeschePakete=parseInt(document.getElementById("ed_wpakete").value)||0;
  b.waeschePreis=parseFloat(document.getElementById("ed_wpreis").value);
  b.waesche=b.waeschePakete>0;
  b.von=document.getElementById("ed_von").value;
  b.bis=document.getElementById("ed_bis").value;
  // Preis/Nacht (leer = Saisonpreis)
  var np=document.getElementById("ed_nacht").value;
  b.nachtPreis=(np!==""&&!isNaN(parseFloat(np))&&parseFloat(np)>0)?parseFloat(np):null;
  // Gespeichert wird EXAKT was eingegeben wurde - KEINE Neuberechnung
  b.total=parseFloat(document.getElementById("ed_total").value)||0;
  b.anzahlung.amount=parseFloat(document.getElementById("ed_anz").value)||0;
  b.restzahlung.amount=parseFloat(document.getElementById("ed_rest").value)||0;
  // Sicherstellen: Anzahlung + Rest = Gesamtpreis (Differenz auf die Anzahlung)
  var diffAR=Math.round((b.total-b.anzahlung.amount-b.restzahlung.amount)*100)/100;
  if(Math.abs(diffAR)>=0.01){b.anzahlung.amount=Math.round((b.anzahlung.amount+diffAR)*100)/100;}
  b.accom=parseInt(document.getElementById("ed_accom").value)||0;
  b.extraFee=parseFloat(document.getElementById("ed_extra").value)||0;
  b.dogFee=parseInt(document.getElementById("ed_dog").value)||0;
  b.waescheFee=parseInt(document.getElementById("ed_waesche").value)||0;
  b.cleanFee=parseInt(document.getElementById("ed_clean").value)||0;
  b.kurFee=parseFloat(document.getElementById("ed_kurfee").value)||0;
  b.invoiceNr=document.getElementById("ed_inv").value.trim();
  b.priceNote=document.getElementById("ed_pnote").value.trim();
  b.source=document.getElementById("ed_src").value.trim();
  b.reviewFlag=false; // einmal manuell geprueft/gespeichert = Markierung entfaellt
  saveAll(true);
  closeM();renderAll();
}

function sendMsg(uid,id,type,channel){
  var b=DATA[uid].bookings.find(function(x){return x._id===id;});if(!b)return;
  var u=UNITS.find(function(x){return x.id===uid;});
  var cost=getStoredCost(uid,b);

  else txt=tplBestaetigung(uid,b,cost);

  if(channel==="wa"){
    var waNum=b.phone||ADMINWA;
    window.open("https://wa.me/"+waNum+"?text="+encodeURIComponent(txt),"_blank");
  }else if(channel==="direct"){
    var subj=type==="angebot"?"Angebot "+u.name+" "+inv:"Buchungsbestaetigung "+u.name+" "+inv;
    sendMailViaGAS(b.email,subj,txt);
  }else{

    window.open("mailto:"+to+"?subject="+encodeURIComponent(subj2)+"&body="+encodeURIComponent(txt),"_blank");
  }
}

// Direkter E-Mail-Versand ueber das Apps Script (GmailApp) - kein mailto noetig
function sendMailViaGAS(to,subject,text){
  if(!GAS_ANFRAGEN_URL){ alert("Bitte zuerst die Apps-Script-URL im Gmail-Anfragen-Bereich eintragen."); return; }
  if(!to){ alert("Diese Buchung hat keine E-Mail-Adresse. Bitte ueber 'Aendern' eintragen."); return; }
  if(!confirm("E-Mail jetzt direkt an "+to+" senden?")) return;
  fetch(GAS_ANFRAGEN_URL, {
    method:"POST", redirect:"follow",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify({ token:GAS_TOKEN, action:"sendMail", to:to, subject:subject, text:text, fromName:"Duenenvilla", replyTo:MAIL })
  })
  .then(function(r){ return r.text(); })
  .then(function(t){
    var res; try{ res=JSON.parse(t); }catch(e){ alert("Unerwartete Antwort beim Senden."); return; }
    if(res.ok) alert("E-Mail wurde an "+to+" gesendet.");
    else alert("Fehler beim Senden: "+(res.error||"unbekannt"));
  })
  .catch(function(err){ alert("Fehler beim Senden: "+err.message); });
}

/* Excel-Export des Reinigungsplans fuer Frau Hessenkamp (aus Live-Daten) */
function XLA(r,c){var s="";var cc=c-1;while(cc>=0){s=String.fromCharCode(65+(cc%26))+s;cc=Math.floor(cc/26)-1;}return s+r;}

/* Excel im Format von Frau Hessenkamp (Petra) aus Live-Daten, rollierendes 3-Monats-Fenster ab akt. Monat */
var PETRA_SATZ={dv3:{rein:63,waes:22.5},dv5:{rein:63,waes:22.5},sv8a:{rein:"",waes:22.5},sv8b:{rein:"",waes:22.5}};
var HESSEN_SHEETS=[{name:"Dünenvilla",units:["dv3","dv5"]},{name:"Thiessow Strandperle",units:["sv8a","sv8b"]}];

function exportReinigungExcel(){
  if(typeof XLSX==="undefined"){alert("Excel-Bibliothek nicht geladen (Internetverbindung noetig).");return;}
  var start=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  var end=new Date(TODAY.getFullYear(),TODAY.getMonth()+3,0);   // letzter Tag von akt.Monat +2
  var WFMT='[=0]"0";0"x"';
  var wb=XLSX.utils.book_new();
  HESSEN_SHEETS.forEach(function(sh){
    var ws={},maxR=1;
    function put(r,c,cell){ws[XLA(r,c)]=cell;if(r>maxR)maxR=r;}
    function str(r,c,v){put(r,c,{t:"s",v:v});}
    function num(r,c,v,z){var o={t:"n",v:v};if(z)o.z=z;put(r,c,o);}
    var row=1;
    str(row,3,sh.name);row+=2;
    sh.units.forEach(function(uid){
      var uobj=UNITS.find(function(x){return x.id===uid;});
      var secName=(uobj?uobj.name:uid).replace("Duenenvilla","Dünenvilla");
      var pr=PETRA_SATZ[uid]||{rein:"",waes:22.5};
      str(row,1,secName);row++;
      ["Von","Bis","Name","Erwachsene","Kinder","Wäsche","Petra Reinigung","Petra Wäsche"].forEach(function(h,i){str(row,i+1,h);});row++;
      str(row,3,"Petra-Satz:");
      if(pr.rein!==""&&pr.rein!=null)num(row,7,pr.rein,'#,##0.00');
      num(row,8,pr.waes,'#,##0.00');
      var rateRow=row;row++;
      var firstData=row;
      var list=[];
      DATA[uid].bookings.forEach(function(b){var ab=pd(b.bis);if(ab>=start&&ab<=end)list.push(b);});
      list.sort(function(a,b){return a.von<b.von?-1:1;});
      list.forEach(function(b){
        var nc=getRpNc((uobj?uobj.short:uid)+"|"+b.bis);
        str(row,1,fmt(b.von));
        str(row,2,b.bis?fmt(b.bis):"");
        str(row,3,"Gäste Fries");
        num(row,4,(b.kurErw!=null?b.kurErw:(b.pers||0)));
        var kk=b.kurKind||0; if(kk)num(row,5,kk);
        var wc=(b.waeschePakete!=null)?b.waeschePakete:(b.waesche?(b.pers||0):0);
        num(row,6,wc,WFMT);
        if(nc){ str(row,7,"keine Reinigung"); }
        else { put(row,7,{t:"n",f:XLA(rateRow,7),v:(pr.rein||0)}); }
        put(row,8,{t:"n",f:"F"+row+"*"+XLA(rateRow,8),v:wc*(pr.waes||0)});
        row++;
      });
      row+=2;                          // zwei leere Zeilen zum Ergaenzen
      var lastData=row-1;
      str(row,3,"Summe Petra");
      put(row,7,{t:"n",f:"SUM("+XLA(firstData,7)+":"+XLA(lastData,7)+")"});
      put(row,8,{t:"n",f:"SUM("+XLA(firstData,8)+":"+XLA(lastData,8)+")"});
      row+=2;

/* === ANREISE-INFO: WLAN + Objekt-Hinweis je Wohnung (editierbar, gespeichert) === */
var ANRINFO_KEY="dv_anreise_info";
var ANR_DEF={
  dv3:{ssid:"FRITZ!Box 7530 RC",pw:"",hinweis:"Am Ende der Treppe befindet sich rechts Ihr Garten - exklusiv fuer Sie, mit direktem Strandzugang."},
  dv5:{ssid:"FRITZ!Box 7530 RC",pw:"",hinweis:"Ihr Garten befindet sich rechter Hand in Richtung Strand."},
  sv8a:{ssid:"",pw:"",hinweis:""},
  sv8b:{ssid:"",pw:"",hinweis:""}
};
var ANR_INFO={};
try{ANR_INFO=JSON.parse(localStorage.getItem(ANRINFO_KEY)||"{}");}catch(e){ANR_INFO={};}
function getAnr(uid){
  var d=ANR_DEF[uid]||{ssid:"",pw:"",hinweis:""};
  var s=ANR_INFO[uid]||{};
  return {ssid:(s.ssid!=null?s.ssid:d.ssid),pw:(s.pw!=null?s.pw:d.pw),hinweis:(s.hinweis!=null?s.hinweis:d.hinweis)};
}
function setAnr(uid,feld,wert){
  if(!ANR_INFO[uid])ANR_INFO[uid]={};
  ANR_INFO[uid][feld]=wert;
  localStorage.setItem(ANRINFO_KEY,JSON.stringify(ANR_INFO));
}
/* Baut den WLAN- und Hinweisblock fuer die Anreise-Info */
function anreiseZusatz(uid,fett){
  var a=getAnr(uid),t="";
  if(a.ssid||a.pw){
    t+="\nWLAN (Glasfaseranschluss)\n";
    if(a.ssid)t+="Netzwerk (SSID): "+(fett?"*"+a.ssid+"*":a.ssid)+"\n";
    if(a.pw)  t+="Passwort: "+(fett?"*"+a.pw+"*":a.pw)+"\n";
    t+="Alternativ den QR-Code auf der Rueckseite der FritzBox mit der Handy-Kamera scannen.\nViel Spass beim Surfen!\n";
  }
  if(a.hinweis)t+="\nIhr Garten\n"+a.hinweis+"\n";
  return t;
}

/* WLAN/Hinweis speichern und Vorschau sofort aktualisieren */
function anrUpd(uid){
  setAnr(uid,"ssid",document.getElementById("anr_ssid").value);

  setAnr(uid,"hinweis",document.getElementById("anr_hint").value);
  var z=document.getElementById("anrZusatz");
  if(z)z.textContent=anreiseZusatz(uid,false);
}

function doSendAnreise(uid,id){
  var b=DATA[uid].bookings.find(function(x){return x._id===id;});if(!b)return;
  var u=UNITS.find(function(x){return x.id===uid;});
  var nachname=b.gast.split(" ").pop();

  var wt="Guten Tag Familie "+nachname+",\n\n";
  wt+="Ihr Urlaub in der "+u.name+" ist gebucht.\n";
  wt+="Anreise: "+fmt(b.von)+" ab 16:00 Uhr\n";
  wt+="Abreise: "+fmt(b.bis)+" bis 10:00 Uhr\n\n";
  wt+="Die Codenummer des Schluesseltresors lautet: *"+code+"*\n";
  wt+=wNote;
  wt+=anreiseZusatz(uid,true);
  wt+="\nEine angenehme Anreise wuenschen wir Ihnen!\n\nHerzliche Gruesse\nFamilie Fries\nwww.duenenvilla.de";
  var phone=b.phone||"";
  if(phone&&!phone.startsWith("+")&&!phone.startsWith("00")){phone="49"+phone.replace(/^0/,"");}
  phone=phone.replace(/[^0-9+]/g,"");
  if(!phone)phone=ADMINWA;
  window.open("https://wa.me/"+phone.replace("+","")+"?text="+encodeURIComponent(wt),"_blank");
}
